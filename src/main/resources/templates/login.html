<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>UPT - Sistema Integral de Biblioteca y Trámites</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }
        .login-header {
            background: #0d47a1;
            color: #ffffff;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .login-body {
            padding: 2rem 2rem;
        }
        .badge-role {
            font-size: 0.75rem;
            margin-right: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h4 class="fw-bold mb-1"><i class="bi bi-mortarboard-fill me-2"></i>UPT - Portal Académico</h4>
        <small class="text-light">Gestión de Biblioteca y Trámites Académicos</small>
    </div>
    
    <div class="login-body">
        <div th:if="${errorMsg}" class="alert alert-danger py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMsg}"></span>
        </div>
        <div th:if="${infoMsg}" class="alert alert-success py-2" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${infoMsg}"></span>
        </div>

        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Código o Correo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" id="usuarioInput" name="usuario" class="form-control" placeholder="Ej: 20210001 o BIB001" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" id="passwordInput" name="password" class="form-control" value="123456" required>
                </div>
            </div>

            <div class="mb-3 p-2 bg-light rounded border">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="small fw-bold text-dark"><i class="bi bi-laptop me-1"></i> Identificador de Equipo Físico:</span>
                    <span th:if="${equipoEnrolado != null}" class="badge bg-success" th:text="${equipoEnrolado.efjavOficina}"></span>
                    <span th:if="${equipoEnrolado == null}" class="badge bg-secondary">No Enrolado (PC Externa)</span>
                </div>
                <div class="font-monospace text-muted small text-truncate" th:text="${deviceToken}"></div>
                <small class="text-muted" style="font-size: 0.75rem;">Reconocimiento real por token único persistente del dispositivo.</small>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Continuar (Paso 1)
            </button>
        </form>

        <hr class="my-3">
        <div class="text-center">
            <small class="text-muted d-block mb-1">Acceso rápido para prueba de roles (Contraseña: 123456):</small>
            <span class="badge bg-primary badge-role" onclick="llenar('20210001')">Estudiante</span>
            <span class="badge bg-success badge-role" onclick="llenar('BIB001')">Biblioteca</span>
            <span class="badge bg-warning text-dark badge-role" onclick="llenar('DEC001')">Decano</span>
            <span class="badge bg-info text-dark badge-role" onclick="llenar('EPI001')">EPIS</span>
            <span class="badge bg-secondary badge-role" onclick="llenar('COB001')">Cobranzas</span>
        </div>
    </div>
</div>

<script>
    function llenar(usr) {
        document.getElementById('usuarioInput').value = usr;
        document.getElementById('passwordInput').value = '123456';
    }
</script>
</body>
</html>
