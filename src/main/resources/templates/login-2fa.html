<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>UPT - Verificación 2FA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .twofa-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            max-width: 460px;
            width: 100%;
            overflow: hidden;
        }
        .twofa-header {
            background: #1565c0;
            color: #ffffff;
            padding: 1.5rem;
            text-align: center;
        }
        .otp-input {
            letter-spacing: 0.5em;
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="twofa-card">
    <div class="twofa-header">
        <i class="bi bi-shield-lock-fill" style="font-size: 2.5rem;"></i>
        <h5 class="fw-bold mt-2 mb-0">Autenticación de Doble Factor (2FA)</h5>
        <small class="text-light">Obligatorio según normativa UPT</small>
    </div>

    <div class="p-4">
        <div class="text-center mb-3">
            <p class="mb-1 text-muted">Usuario identificado:</p>
            <h6 class="fw-bold" th:text="${nombreUsuario} + ' (' + ${codigoUsuario} + ')'"></h6>
            <div class="small text-muted font-monospace text-truncate" th:text="'Equipo: ' + ${deviceToken}"></div>
        </div>

        <div th:if="${errorMsg}" class="alert alert-danger py-2" role="alert">
            <i class="bi bi-x-circle-fill me-1"></i> <span th:text="${errorMsg}"></span>
        </div>

        <!-- Caja de apoyo / demostración visual -->
        <div class="alert alert-info py-2 small mb-3">
            <div><i class="bi bi-envelope-check me-1"></i> <strong>Código OTP generado:</strong> <span class="badge bg-dark fs-6" th:text="${otpDebug}"></span></div>
            <div class="mt-1"><i class="bi bi-key-fill me-1"></i> <strong>Secreto Bitwarden/TOTP:</strong> <code th:text="${totpSecret}"></code></div>
            <small class="text-muted d-block mt-1">Válido por 5 minutos (o use su aplicación autenticadora).</small>
        </div>

        <form action="/login-2fa" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary text-center w-100">Ingrese el código de 6 dígitos</label>
                <input type="text" name="codigo2fa" class="form-control otp-input" maxlength="6" placeholder="000000" autofocus required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-check2-circle me-1"></i> Verificar y Acceder
            </button>
            <a href="/login" class="btn btn-link w-100 mt-2 text-decoration-none text-muted">
                <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
            </a>
        </form>
    </div>
</div>

</body>
</html>
