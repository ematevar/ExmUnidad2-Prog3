# Spring Datasource Configuration (MySQL XAMPP puerto 3306)
spring.application.name=efjavbiblioteca

spring.datasource.url=jdbc:mysql://localhost:3306/db_biblioteca_tramites?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Uploads Configuration
efjav.storage.location=./uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Time and Simulator settings
efjav.business.enforce-schedule=true
efjav.business.simulated-hour=
